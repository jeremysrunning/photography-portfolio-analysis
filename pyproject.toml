[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "photography-portfolio-analysis"
version = "0.1.0"
description = "A source-agnostic engine for discovering patterns in photographic portfolios."
readme = "docs/README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Photography Portfolio Analysis contributors" }]
dependencies = [
    "numpy==2.5.1",
    "Pillow==12.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
]
research = [
    "psutil==7.2.2",
]

[project.scripts]
ppa = "ppa.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ppa"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
